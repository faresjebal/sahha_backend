spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${CLINICAL_DB_URL}?currentSchema=clinical_test
spring.datasource.username=${CLINICAL_DB_USERNAME}
spring.datasource.password=${CLINICAL_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaClinicalTestPool
spring.datasource.hikari.maximum-pool-size=4

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=clinical_test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=clinical_test
spring.flyway.schemas=clinical_test
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

sahha.clinical.security.jwk-set-uri=http://127.0.0.1:65535/.well-known/jwks.json
sahha.clinical.security.secure-cookies=false
sahha.clinical.scheduling-client.base-url=http://scheduling-service
sahha.clinical.outbox.publisher-enabled=false
