spring.application.name=clinical-service
spring.cloud.config.enabled=${CONFIG_CLIENT_ENABLED:false}
server.port=${SERVER_PORT:8085}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true


sahha.clinical.security.access-token-cookie-name=${AUTH_ACCESS_COOKIE_NAME:SAHHA_ACCESS_TOKEN}
sahha.clinical.security.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
sahha.clinical.security.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
sahha.clinical.security.audience=${AUTH_JWT_AUDIENCE:sahha-api}
sahha.clinical.security.csrf-token-name=${AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
sahha.clinical.security.csrf-header-name=${AUTH_CSRF_HEADER_NAME:X-XSRF-TOKEN}
sahha.clinical.security.secure-cookies=${AUTH_COOKIE_SECURE:false}

sahha.clinical.scheduling-client.base-url=${SCHEDULING_SERVICE_BASE_URL:http://scheduling-service}
sahha.clinical.communication-client.base-url=${COMMUNICATION_SERVICE_BASE_URL:http://communication-service}
sahha.clinical.organisation-client.base-url=${ORGANISATION_SERVICE_BASE_URL:http://organisation-service}
sahha.clinical.openapi.enabled=${CLINICAL_OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${sahha.clinical.openapi.enabled}
springdoc.swagger-ui.enabled=${sahha.clinical.openapi.enabled}

spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties],classpath:health-policy.properties,classpath:api-policy.properties

spring.datasource.url=${CLINICAL_DB_URL}
spring.datasource.username=${CLINICAL_DB_USERNAME}
spring.datasource.password=${CLINICAL_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaClinicalPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

sahha.clinical.outbox.publisher-enabled=${CLINICAL_OUTBOX_PUBLISHER_ENABLED:false}
sahha.clinical.outbox.topic=${CLINICAL_CONSULTATION_TOPIC:sahha.clinical.consultations.v1}
sahha.clinical.outbox.batch-size=${CLINICAL_OUTBOX_BATCH_SIZE:50}
sahha.clinical.outbox.fixed-delay=${CLINICAL_OUTBOX_FIXED_DELAY:PT1S}
sahha.clinical.outbox.send-timeout=${CLINICAL_OUTBOX_SEND_TIMEOUT:PT5S}
sahha.clinical.outbox.claim-lease=${CLINICAL_OUTBOX_CLAIM_LEASE:PT1M}
sahha.clinical.outbox.initial-retry-delay=${CLINICAL_OUTBOX_INITIAL_RETRY_DELAY:PT5S}
sahha.clinical.outbox.maximum-retry-delay=${CLINICAL_OUTBOX_MAXIMUM_RETRY_DELAY:PT5M}
