spring.application.name=notification-service
server.port=${SERVER_PORT:8087}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${NOTIFICATION_DB_URL}
spring.datasource.username=${NOTIFICATION_DB_USERNAME}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaNotificationPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.listener.ack-mode=record

sahha.notification.appointment-consumer.enabled=${NOTIFICATION_APPOINTMENT_CONSUMER_ENABLED:false}
sahha.notification.appointment-consumer.topic=${SCHEDULING_APPOINTMENT_TOPIC:sahha.scheduling.appointments.v1}
sahha.notification.appointment-consumer.group-id=${NOTIFICATION_APPOINTMENT_GROUP_ID:sahha-notification-appointments-v1}

sahha.notification.communication-consumer.enabled=${NOTIFICATION_COMMUNICATION_CONSUMER_ENABLED:false}
sahha.notification.communication-consumer.topic=${COMMUNICATION_MESSAGE_TOPIC:sahha.communication.messages.v1}
sahha.notification.communication-consumer.group-id=${NOTIFICATION_COMMUNICATION_GROUP_ID:sahha-notification-communication-v1}

sahha.notification.security.access-token-cookie-name=${AUTH_ACCESS_TOKEN_COOKIE_NAME:SAHHA_ACCESS_TOKEN}
sahha.notification.security.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
sahha.notification.security.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
sahha.notification.security.audience=${AUTH_JWT_AUDIENCE:sahha-api}
sahha.notification.security.csrf-token-name=${AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
sahha.notification.security.csrf-header-name=${AUTH_CSRF_HEADER_NAME:X-XSRF-TOKEN}
sahha.notification.security.secure-cookies=${AUTH_SECURE_COOKIES:false}
sahha.notification.security.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}

sahha.notification.organisation-client.base-url=${ORGANISATION_SERVICE_URL:http://organisation-service}
