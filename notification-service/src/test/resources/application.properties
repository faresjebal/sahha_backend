spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${NOTIFICATION_DB_URL}?currentSchema=notification_test
spring.datasource.username=${NOTIFICATION_DB_USERNAME}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaNotificationTestPool
spring.datasource.hikari.maximum-pool-size=4

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=notification_test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=notification_test
spring.flyway.schemas=notification_test
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

sahha.notification.appointment-consumer.enabled=false
sahha.notification.communication-consumer.enabled=false

sahha.notification.security.access-token-cookie-name=SAHHA_ACCESS_TOKEN
sahha.notification.security.jwk-set-uri=http://localhost:9/.well-known/jwks.json
sahha.notification.security.issuer=http://localhost:8081
sahha.notification.security.audience=sahha-api
sahha.notification.security.csrf-token-name=XSRF-TOKEN
sahha.notification.security.csrf-header-name=X-XSRF-TOKEN
sahha.notification.security.secure-cookies=false
sahha.notification.security.allowed-origins=http://localhost:5173

sahha.notification.organisation-client.base-url=http://organisation-service
