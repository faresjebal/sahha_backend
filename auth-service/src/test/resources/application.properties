spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${AUTH_TEST_DB_URL}
spring.datasource.username=${AUTH_TEST_DB_USERNAME}
spring.datasource.password=${AUTH_TEST_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaAuthTestPool
spring.datasource.hikari.maximum-pool-size=4

eureka.client.enabled=false
spring.cloud.discovery.enabled=false
sahha.auth.organisation-client.base-url=http://localhost:18082

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

sahha.auth.security.bcrypt-strength=4
sahha.auth.mail.enabled=false
sahha.auth.session-cache.enabled=false
sahha.auth.session-retention.cleanup-enabled=false
sahha.auth.rate-limit.enabled=false
sahha.auth.outbox.publisher-enabled=false
spring.data.redis.repositories.enabled=false
spring.data.redis.username=
spring.data.redis.password=
management.health.redis.enabled=false
sahha.auth.jwt.ephemeral-key-enabled=true
sahha.auth.cookies.secure=false
