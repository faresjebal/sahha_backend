spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties],optional:file:.env.mail.local[.properties],optional:file:../.env.mail.local[.properties],optional:file:.env.redis.local[.properties],optional:file:../.env.redis.local[.properties]

spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USERNAME}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaAuthPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

sahha.auth.jwt.ephemeral-key-enabled=${AUTH_JWT_EPHEMERAL_KEY_ENABLED:true}
sahha.auth.cookies.secure=${AUTH_COOKIE_SECURE:false}
