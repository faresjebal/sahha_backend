spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${AUTH_OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${AUTH_OPENAPI_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

sahha.auth.session-cache.enabled=${AUTH_SESSION_CACHE_ENABLED:true}
sahha.auth.session-cache.maximum-active-ttl=${AUTH_SESSION_CACHE_MAXIMUM_ACTIVE_TTL:PT30S}

sahha.auth.session-retention.cleanup-enabled=${AUTH_SESSION_CLEANUP_ENABLED:true}
sahha.auth.session-retention.refresh-token-retention=${AUTH_REFRESH_TOKEN_RETENTION:P7D}
sahha.auth.session-retention.family-batch-size=${AUTH_SESSION_CLEANUP_FAMILY_BATCH_SIZE:100}
sahha.auth.session-retention.fixed-delay=${AUTH_SESSION_CLEANUP_FIXED_DELAY:PT1H}

sahha.auth.rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
sahha.auth.rate-limit.login-maximum-attempts=${AUTH_LOGIN_IP_MAXIMUM_ATTEMPTS:30}
sahha.auth.rate-limit.login-window=${AUTH_LOGIN_IP_WINDOW:PT15M}
sahha.auth.rate-limit.registration-maximum-attempts=${AUTH_REGISTRATION_IP_MAXIMUM_ATTEMPTS:5}
sahha.auth.rate-limit.registration-window=${AUTH_REGISTRATION_IP_WINDOW:PT1H}
sahha.auth.rate-limit.email-request-maximum-attempts=${AUTH_EMAIL_REQUEST_IP_MAXIMUM_ATTEMPTS:5}
sahha.auth.rate-limit.email-request-window=${AUTH_EMAIL_REQUEST_IP_WINDOW:PT1H}
sahha.auth.rate-limit.token-confirmation-maximum-attempts=${AUTH_TOKEN_CONFIRMATION_IP_MAXIMUM_ATTEMPTS:20}
sahha.auth.rate-limit.token-confirmation-window=${AUTH_TOKEN_CONFIRMATION_IP_WINDOW:PT15M}
sahha.auth.rate-limit.refresh-maximum-attempts=${AUTH_REFRESH_IP_MAXIMUM_ATTEMPTS:60}
sahha.auth.rate-limit.refresh-window=${AUTH_REFRESH_IP_WINDOW:PT5M}

sahha.auth.outbox.publisher-enabled=${AUTH_OUTBOX_PUBLISHER_ENABLED:false}
sahha.auth.outbox.topic=${AUTH_SECURITY_EVENT_TOPIC:sahha.auth.security-events.v1}
sahha.auth.outbox.batch-size=${AUTH_OUTBOX_BATCH_SIZE:50}
sahha.auth.outbox.fixed-delay=${AUTH_OUTBOX_FIXED_DELAY:PT1S}
sahha.auth.outbox.send-timeout=${AUTH_OUTBOX_SEND_TIMEOUT:PT5S}
sahha.auth.outbox.initial-retry-delay=${AUTH_OUTBOX_INITIAL_RETRY_DELAY:PT5S}
sahha.auth.outbox.maximum-retry-delay=${AUTH_OUTBOX_MAXIMUM_RETRY_DELAY:PT5M}

spring.data.redis.host=${AUTH_REDIS_HOST:localhost}
spring.data.redis.port=${AUTH_REDIS_PORT:6379}
spring.data.redis.username=${AUTH_REDIS_USERNAME:}
spring.data.redis.password=${AUTH_REDIS_PASSWORD:}
spring.data.redis.database=${AUTH_REDIS_DATABASE:0}
spring.data.redis.client-name=${AUTH_REDIS_CLIENT_NAME:sahha-auth-service}
spring.data.redis.client-type=lettuce
spring.data.redis.connect-timeout=${AUTH_REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${AUTH_REDIS_COMMAND_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

sahha.auth.security.bcrypt-strength=${AUTH_BCRYPT_STRENGTH:12}
sahha.auth.security.minimum-password-length=${AUTH_MINIMUM_PASSWORD_LENGTH:12}
sahha.auth.security.maximum-password-length=${AUTH_MAXIMUM_PASSWORD_LENGTH:128}
sahha.auth.security.maximum-failed-login-attempts=${AUTH_MAXIMUM_FAILED_LOGIN_ATTEMPTS:5}
sahha.auth.security.login-lock-duration=${AUTH_LOGIN_LOCK_DURATION:PT15M}
sahha.auth.security.session-idle-lifetime=${AUTH_SESSION_IDLE_LIFETIME:PT168H}
sahha.auth.security.session-absolute-lifetime=${AUTH_SESSION_ABSOLUTE_LIFETIME:PT720H}
sahha.auth.security.email-verification-lifetime=${AUTH_EMAIL_VERIFICATION_LIFETIME:PT24H}
sahha.auth.security.password-reset-lifetime=${AUTH_PASSWORD_RESET_LIFETIME:PT30M}
sahha.auth.security.email-change-lifetime=${AUTH_EMAIL_CHANGE_LIFETIME:PT30M}
sahha.auth.security.email-verification-request-cooldown=${AUTH_EMAIL_VERIFICATION_REQUEST_COOLDOWN:PT2M}
sahha.auth.security.password-reset-request-cooldown=${AUTH_PASSWORD_RESET_REQUEST_COOLDOWN:PT2M}

sahha.auth.jwt.access-token-lifetime=${AUTH_ACCESS_TOKEN_LIFETIME:PT10M}
sahha.auth.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
sahha.auth.jwt.audience=${AUTH_JWT_AUDIENCE:sahha-api}
sahha.auth.jwt.ephemeral-key-enabled=${AUTH_JWT_EPHEMERAL_KEY_ENABLED:false}
sahha.auth.jwt.private-key-base64=${AUTH_JWT_PRIVATE_KEY_BASE64:}
sahha.auth.jwt.public-key-base64=${AUTH_JWT_PUBLIC_KEY_BASE64:}

sahha.auth.cookies.access-token-name=${AUTH_ACCESS_COOKIE_NAME:SAHHA_ACCESS_TOKEN}
sahha.auth.cookies.refresh-token-name=${AUTH_REFRESH_COOKIE_NAME:SAHHA_REFRESH_TOKEN}
sahha.auth.cookies.device-id-name=${AUTH_DEVICE_COOKIE_NAME:SAHHA_DEVICE_ID}
sahha.auth.cookies.csrf-token-name=${AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
sahha.auth.cookies.csrf-header-name=${AUTH_CSRF_HEADER_NAME:X-XSRF-TOKEN}
sahha.auth.cookies.access-path=/
sahha.auth.cookies.refresh-path=/api/v1/auth
sahha.auth.cookies.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
sahha.auth.cookies.secure=${AUTH_COOKIE_SECURE:true}
sahha.auth.cookies.device-id-lifetime=${AUTH_DEVICE_COOKIE_LIFETIME:P365D}

sahha.auth.mail.enabled=${AUTH_MAIL_ENABLED:false}
sahha.auth.mail.from-name=${AUTH_MAIL_FROM_NAME:Sahha}
sahha.auth.mail.from-email=${AUTH_MAIL_FROM_EMAIL:no-reply@example.invalid}
sahha.auth.mail.frontend-base-url=${AUTH_FRONTEND_BASE_URL:http://localhost:5173}
sahha.auth.mail.email-verification-path=${AUTH_EMAIL_VERIFICATION_PATH:/verify-email}
sahha.auth.mail.password-reset-path=${AUTH_PASSWORD_RESET_PATH:/reset-password}

spring.mail.host=${AUTH_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${AUTH_SMTP_PORT:587}
spring.mail.username=${AUTH_SMTP_USERNAME:}
spring.mail.password=${AUTH_SMTP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
