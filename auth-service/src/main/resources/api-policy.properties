# Foundation HTTP/logging defaults. Do not enable request/body/token logging.
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-path=never
spring.mvc.log-request-details=false
spring.http.codecs.log-request-details=false
spring.jpa.show-sql=false
logging.pattern.level=%5p [requestId:%X{requestId:-unavailable}]
# Unknown paths and SQL exception detail may include submitted personal data.
logging.level.org.springframework.web.servlet.PageNotFound=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
