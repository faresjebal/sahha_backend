eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${FILE_DB_URL}?currentSchema=file_test
spring.datasource.username=${FILE_DB_USERNAME}
spring.datasource.password=${FILE_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaFileTestPool
spring.datasource.hikari.maximum-pool-size=4

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=file_test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=file_test
spring.flyway.schemas=file_test
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

sahha.file.storage.provider=memory
sahha.file.storage.endpoint=http://127.0.0.1:65535
sahha.file.storage.access-key=test-access-key
sahha.file.storage.secret-key=test-secret-key
sahha.file.storage.region=us-east-1
sahha.file.storage.bucket=sahha-medical-files-test
sahha.file.storage.allowed-content-types=application/pdf,image/jpeg,image/png
sahha.file.storage.maximum-object-size=1MB
sahha.file.storage.upload-ticket-ttl=PT5M
sahha.file.storage.download-grant-ttl=PT2M
sahha.file.storage.synthetic-clean-enabled=true
sahha.file.outbox.publisher-enabled=false

sahha.file.security.jwk-set-uri=http://127.0.0.1:65535/.well-known/jwks.json
sahha.file.security.secure-cookies=false
sahha.file.clinical-client.base-url=http://clinical-service
spring.cloud.config.enabled=false
