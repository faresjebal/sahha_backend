# Opt-in shared, non-secret configuration. A missing server fails startup.
# Use local,platform for native development; never use local for Azure production.
spring.cloud.config.enabled=${CONFIG_CLIENT_ENABLED:true}
spring.config.import=configserver:${CONFIG_SERVER_URL:http://127.0.0.1:8888}
spring.cloud.config.request-connect-timeout=2000
spring.cloud.config.request-read-timeout=5000
