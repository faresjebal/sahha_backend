spring.application.name=file-service
server.port=${SERVER_PORT:8088}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${FILE_DB_URL}
spring.datasource.username=${FILE_DB_USERNAME}
spring.datasource.password=${FILE_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaFilePool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

sahha.file.outbox.publisher-enabled=${FILE_OUTBOX_PUBLISHER_ENABLED:false}
sahha.file.outbox.topic=${FILE_EVENT_TOPIC:sahha.file.medical-files.v1}
sahha.file.outbox.batch-size=${FILE_OUTBOX_BATCH_SIZE:50}
sahha.file.outbox.fixed-delay=${FILE_OUTBOX_FIXED_DELAY:PT1S}
sahha.file.outbox.send-timeout=${FILE_OUTBOX_SEND_TIMEOUT:PT5S}
sahha.file.outbox.claim-lease=${FILE_OUTBOX_CLAIM_LEASE:PT1M}
sahha.file.outbox.initial-retry-delay=${FILE_OUTBOX_INITIAL_RETRY_DELAY:PT5S}
sahha.file.outbox.maximum-retry-delay=${FILE_OUTBOX_MAXIMUM_RETRY_DELAY:PT5M}

sahha.file.storage.provider=${FILE_STORAGE_PROVIDER:seaweedfs}
sahha.file.storage.endpoint=${SEAWEEDFS_S3_ENDPOINT:http://127.0.0.1:8333}
sahha.file.storage.access-key=${SEAWEEDFS_S3_ACCESS_KEY:sahha-local-access-key}
sahha.file.storage.secret-key=${SEAWEEDFS_S3_SECRET_KEY:sahha-local-secret-key}
sahha.file.storage.region=${SEAWEEDFS_S3_REGION:us-east-1}
sahha.file.storage.bucket=${SEAWEEDFS_FILE_BUCKET:sahha-medical-files}
sahha.file.storage.allowed-content-types=${FILE_ALLOWED_CONTENT_TYPES:application/pdf,image/jpeg,image/png}
sahha.file.storage.maximum-object-size=${FILE_MAXIMUM_OBJECT_SIZE:10MB}
sahha.file.storage.upload-ticket-ttl=${FILE_UPLOAD_TICKET_TTL:PT5M}
sahha.file.storage.download-grant-ttl=${FILE_DOWNLOAD_GRANT_TTL:PT2M}
sahha.file.storage.synthetic-clean-enabled=${FILE_SYNTHETIC_CLEAN_ENABLED:false}

sahha.file.security.access-token-cookie-name=${AUTH_ACCESS_COOKIE_NAME:SAHHA_ACCESS_TOKEN}
sahha.file.security.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
sahha.file.security.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
sahha.file.security.audience=${AUTH_JWT_AUDIENCE:sahha-api}
sahha.file.security.csrf-token-name=${AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
sahha.file.security.csrf-header-name=${AUTH_CSRF_HEADER_NAME:X-XSRF-TOKEN}
sahha.file.security.secure-cookies=${AUTH_COOKIE_SECURE:false}

sahha.file.clinical-client.base-url=${CLINICAL_SERVICE_BASE_URL:http://clinical-service}
sahha.file.openapi.enabled=${FILE_OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${sahha.file.openapi.enabled}
springdoc.swagger-ui.enabled=${sahha.file.openapi.enabled}
