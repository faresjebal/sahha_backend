spring.application.name=communication-service
server.port=${SERVER_PORT:8086}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

sahha.communication.security.access-token-cookie-name=${AUTH_ACCESS_COOKIE_NAME:SAHHA_ACCESS_TOKEN}
sahha.communication.security.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
sahha.communication.security.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
sahha.communication.security.audience=${AUTH_JWT_AUDIENCE:sahha-api}
sahha.communication.security.csrf-token-name=${AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
sahha.communication.security.csrf-header-name=${AUTH_CSRF_HEADER_NAME:X-XSRF-TOKEN}
sahha.communication.security.secure-cookies=${AUTH_COOKIE_SECURE:false}

sahha.communication.organisation-client.base-url=${ORGANISATION_SERVICE_BASE_URL:http://organisation-service}
sahha.communication.scheduling-client.base-url=${SCHEDULING_SERVICE_BASE_URL:http://scheduling-service}
sahha.communication.openapi.enabled=${COMMUNICATION_OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${sahha.communication.openapi.enabled}
springdoc.swagger-ui.enabled=${sahha.communication.openapi.enabled}

spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${COMMUNICATION_DB_URL}
spring.datasource.username=${COMMUNICATION_DB_USERNAME}
spring.datasource.password=${COMMUNICATION_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaCommunicationPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

sahha.communication.outbox.publisher-enabled=${COMMUNICATION_OUTBOX_PUBLISHER_ENABLED:false}
sahha.communication.outbox.topic=${COMMUNICATION_TOPIC:sahha.communication.messages.v1}
sahha.communication.outbox.fixed-delay=${COMMUNICATION_OUTBOX_FIXED_DELAY:PT1S}
sahha.communication.outbox.batch-size=${COMMUNICATION_OUTBOX_BATCH_SIZE:50}
sahha.communication.outbox.send-timeout=${COMMUNICATION_OUTBOX_SEND_TIMEOUT:PT5S}
