spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${COMMUNICATION_DB_URL}?currentSchema=communication_test
spring.datasource.username=${COMMUNICATION_DB_USERNAME}
spring.datasource.password=${COMMUNICATION_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaCommunicationTestPool
spring.datasource.hikari.maximum-pool-size=4

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=communication_test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=communication_test
spring.flyway.schemas=communication_test
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

sahha.communication.security.jwk-set-uri=http://127.0.0.1:65535/.well-known/jwks.json
sahha.communication.security.secure-cookies=false
sahha.communication.organisation-client.base-url=http://organisation-service
sahha.communication.scheduling-client.base-url=http://scheduling-service
sahha.communication.outbox.publisher-enabled=false
sahha.communication.referrals.expiry-enabled=false
sahha.communication.sharing.cache-enabled=false
spring.cloud.config.enabled=false
