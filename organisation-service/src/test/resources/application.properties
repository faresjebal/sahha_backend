spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${ORGANISATION_DB_URL}?currentSchema=organisation_test
spring.datasource.username=${ORGANISATION_DB_USERNAME}
spring.datasource.password=${ORGANISATION_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaOrganisationTestPool
spring.datasource.hikari.maximum-pool-size=4

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=organisation_test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=organisation_test
spring.flyway.schemas=organisation_test
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

sahha.organisation.security.jwk-set-uri=http://127.0.0.1:65535/.well-known/jwks.json
sahha.organisation.security.secure-cookies=false
sahha.organisation.auth-client.base-url=http://auth-service
sahha.organisation.staff-invitation.validity=P7D
sahha.organisation.outbox.publisher-enabled=false
