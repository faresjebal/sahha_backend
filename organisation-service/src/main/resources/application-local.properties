spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${ORGANISATION_DB_URL}
spring.datasource.username=${ORGANISATION_DB_USERNAME}
spring.datasource.password=${ORGANISATION_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaOrganisationPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
