spring.application.name=organisation-service
spring.config.import=classpath:health-policy.properties,classpath:api-policy.properties
spring.cloud.config.enabled=${CONFIG_CLIENT_ENABLED:false}
server.port=${SERVER_PORT:8082}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true


sahha.organisation.security.access-token-cookie-name=${AUTH_ACCESS_COOKIE_NAME:SAHHA_ACCESS_TOKEN}
sahha.organisation.security.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
sahha.organisation.security.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
sahha.organisation.security.audience=${AUTH_JWT_AUDIENCE:sahha-api}
sahha.organisation.security.csrf-token-name=${AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
sahha.organisation.security.csrf-header-name=${AUTH_CSRF_HEADER_NAME:X-XSRF-TOKEN}
sahha.organisation.security.secure-cookies=${AUTH_COOKIE_SECURE:false}

sahha.organisation.auth-client.base-url=${AUTH_SERVICE_BASE_URL:http://auth-service}
sahha.organisation.staff-invitation.validity=${STAFF_INVITATION_VALIDITY:P7D}

sahha.organisation.openapi.enabled=${ORGANISATION_OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${sahha.organisation.openapi.enabled}
springdoc.swagger-ui.enabled=${sahha.organisation.openapi.enabled}

sahha.organisation.outbox.publisher-enabled=${ORGANISATION_OUTBOX_PUBLISHER_ENABLED:false}
sahha.organisation.outbox.topic=${ORGANISATION_OUTBOX_TOPIC:sahha.organisation.events.v1}
sahha.organisation.outbox.batch-size=${ORGANISATION_OUTBOX_BATCH_SIZE:50}
sahha.organisation.outbox.fixed-delay=${ORGANISATION_OUTBOX_FIXED_DELAY:PT1S}
sahha.organisation.outbox.send-timeout=${ORGANISATION_OUTBOX_SEND_TIMEOUT:PT5S}
sahha.organisation.outbox.initial-retry-delay=${ORGANISATION_OUTBOX_INITIAL_RETRY_DELAY:PT5S}
sahha.organisation.outbox.maximum-retry-delay=${ORGANISATION_OUTBOX_MAXIMUM_RETRY_DELAY:PT5M}
