# Local operational policy: applies without Config Server and is tested directly.
# Readiness is local serving capacity, not full cross-service workflow health.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.liveness.show-components=never
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.group.readiness.show-components=never
management.endpoint.health.validate-group-membership=true
management.endpoint.health.cache.time-to-live=0ms
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
