spring.application.name=api-gateway
spring.main.web-application-type=reactive
server.port=${SERVER_PORT:8079}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

sahha.gateway.http-client.connect-timeout=${GATEWAY_CONNECT_TIMEOUT:PT5S}
sahha.gateway.http-client.read-timeout=${GATEWAY_READ_TIMEOUT:PT30S}

sahha.gateway.security.access-token-cookie-name=${AUTH_ACCESS_COOKIE_NAME:SAHHA_ACCESS_TOKEN}
sahha.gateway.security.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
sahha.gateway.security.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
sahha.gateway.security.audience=${AUTH_JWT_AUDIENCE:sahha-api}
sahha.gateway.security.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
