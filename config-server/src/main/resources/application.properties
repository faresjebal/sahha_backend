spring.application.name=config-server
spring.config.import=classpath:health-policy.properties
server.port=${SERVER_PORT:8888}
spring.profiles.default=native
spring.cloud.config.server.native.search-locations=${CONFIG_SEARCH_LOCATIONS:classpath:/config-repository}
server.address=${SERVER_ADDRESS:127.0.0.1}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
