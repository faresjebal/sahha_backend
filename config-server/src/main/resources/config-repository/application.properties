# Public operational defaults only. Never store credentials, signing keys,
# connection strings, SMTP settings, or patient information in this repository.
sahha.platform.config-version=native-v1
info.sahha.configuration.version=${sahha.platform.config-version}
management.info.env.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
eureka.instance.metadata-map.config-version=${sahha.platform.config-version}
spring.jpa.open-in-view=false
