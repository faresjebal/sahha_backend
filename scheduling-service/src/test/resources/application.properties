spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${SCHEDULING_DB_URL}?currentSchema=scheduling_test
spring.datasource.username=${SCHEDULING_DB_USERNAME}
spring.datasource.password=${SCHEDULING_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaSchedulingTestPool
spring.datasource.hikari.maximum-pool-size=4

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=scheduling_test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=scheduling_test
spring.flyway.schemas=scheduling_test
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

sahha.scheduling.security.jwk-set-uri=http://127.0.0.1:65535/.well-known/jwks.json
sahha.scheduling.security.secure-cookies=false
sahha.scheduling.organisation-client.base-url=http://organisation-service
sahha.scheduling.patient-client.base-url=http://patient-service
sahha.scheduling.outbox.publisher-enabled=false
sahha.scheduling.clinical-consumer.enabled=false
