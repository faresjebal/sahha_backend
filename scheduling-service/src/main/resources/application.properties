spring.application.name=scheduling-service
server.port=${SERVER_PORT:8084}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

sahha.scheduling.security.access-token-cookie-name=${AUTH_ACCESS_COOKIE_NAME:SAHHA_ACCESS_TOKEN}
sahha.scheduling.security.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
sahha.scheduling.security.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
sahha.scheduling.security.audience=${AUTH_JWT_AUDIENCE:sahha-api}
sahha.scheduling.security.csrf-token-name=${AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
sahha.scheduling.security.csrf-header-name=${AUTH_CSRF_HEADER_NAME:X-XSRF-TOKEN}
sahha.scheduling.security.secure-cookies=${AUTH_COOKIE_SECURE:false}

sahha.scheduling.organisation-client.base-url=${ORGANISATION_SERVICE_BASE_URL:http://organisation-service}
sahha.scheduling.patient-client.base-url=${PATIENT_SERVICE_BASE_URL:http://patient-service}
sahha.scheduling.openapi.enabled=${SCHEDULING_OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${sahha.scheduling.openapi.enabled}
springdoc.swagger-ui.enabled=${sahha.scheduling.openapi.enabled}

spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${SCHEDULING_DB_URL}
spring.datasource.username=${SCHEDULING_DB_USERNAME}
spring.datasource.password=${SCHEDULING_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaSchedulingPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.listener.ack-mode=record

sahha.scheduling.outbox.publisher-enabled=${SCHEDULING_OUTBOX_PUBLISHER_ENABLED:false}
sahha.scheduling.outbox.topic=${SCHEDULING_APPOINTMENT_TOPIC:sahha.scheduling.appointments.v1}
sahha.scheduling.outbox.batch-size=${SCHEDULING_OUTBOX_BATCH_SIZE:50}
sahha.scheduling.outbox.fixed-delay=${SCHEDULING_OUTBOX_FIXED_DELAY:PT1S}
sahha.scheduling.outbox.send-timeout=${SCHEDULING_OUTBOX_SEND_TIMEOUT:PT5S}
sahha.scheduling.outbox.claim-lease=${SCHEDULING_OUTBOX_CLAIM_LEASE:PT5M}
sahha.scheduling.outbox.initial-retry-delay=${SCHEDULING_OUTBOX_INITIAL_RETRY_DELAY:PT5S}
sahha.scheduling.outbox.maximum-retry-delay=${SCHEDULING_OUTBOX_MAXIMUM_RETRY_DELAY:PT5M}

sahha.scheduling.clinical-consumer.enabled=${SCHEDULING_CLINICAL_CONSUMER_ENABLED:false}
sahha.scheduling.clinical-consumer.topic=${CLINICAL_CONSULTATION_TOPIC:sahha.clinical.consultations.v1}
sahha.scheduling.clinical-consumer.group-id=${SCHEDULING_CLINICAL_GROUP_ID:sahha-scheduling-clinical-v1}
