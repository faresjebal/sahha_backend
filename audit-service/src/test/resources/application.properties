eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.config.enabled=false

spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]
spring.datasource.url=${AUDIT_DB_URL}
spring.datasource.username=${AUDIT_DB_USERNAME}
spring.datasource.password=${AUDIT_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaAuditTestPool
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.schema=audit_test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=audit_test
spring.flyway.schemas=audit_test
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db
