spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${PATIENT_DB_URL}?currentSchema=patient_test
spring.datasource.username=${PATIENT_DB_USERNAME}
spring.datasource.password=${PATIENT_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaPatientTestPool
spring.datasource.hikari.maximum-pool-size=4

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=patient_test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=patient_test
spring.flyway.schemas=patient_test
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

sahha.patient.security.jwk-set-uri=http://127.0.0.1:65535/.well-known/jwks.json
sahha.patient.security.secure-cookies=false
sahha.patient.organisation-client.base-url=http://organisation-service
sahha.patient.auth-client.base-url=http://auth-service
sahha.patient.identifier.hmac-secret=synthetic-patient-test-hmac-secret-2026-only
sahha.patient.outbox.publisher-enabled=false
spring.cloud.config.enabled=false
