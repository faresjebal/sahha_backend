spring.application.name=patient-service
server.port=${SERVER_PORT:8083}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

sahha.patient.security.access-token-cookie-name=${AUTH_ACCESS_COOKIE_NAME:SAHHA_ACCESS_TOKEN}
sahha.patient.security.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
sahha.patient.security.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
sahha.patient.security.audience=${AUTH_JWT_AUDIENCE:sahha-api}
sahha.patient.security.csrf-token-name=${AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
sahha.patient.security.csrf-header-name=${AUTH_CSRF_HEADER_NAME:X-XSRF-TOKEN}
sahha.patient.security.secure-cookies=${AUTH_COOKIE_SECURE:false}

sahha.patient.organisation-client.base-url=${ORGANISATION_SERVICE_BASE_URL:http://organisation-service}
sahha.patient.identifier.hmac-secret=${PATIENT_IDENTIFIER_HMAC_SECRET:sahha-local-synthetic-identifier-key-change-me-2026}

sahha.patient.openapi.enabled=${PATIENT_OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${sahha.patient.openapi.enabled}
springdoc.swagger-ui.enabled=${sahha.patient.openapi.enabled}

sahha.patient.outbox.publisher-enabled=${PATIENT_OUTBOX_PUBLISHER_ENABLED:false}
sahha.patient.outbox.topic=${PATIENT_OUTBOX_TOPIC:sahha.patient.events.v1}
sahha.patient.outbox.batch-size=${PATIENT_OUTBOX_BATCH_SIZE:50}
sahha.patient.outbox.fixed-delay=${PATIENT_OUTBOX_FIXED_DELAY:PT1S}
sahha.patient.outbox.send-timeout=${PATIENT_OUTBOX_SEND_TIMEOUT:PT5S}
sahha.patient.outbox.initial-retry-delay=${PATIENT_OUTBOX_INITIAL_RETRY_DELAY:PT5S}
sahha.patient.outbox.maximum-retry-delay=${PATIENT_OUTBOX_MAXIMUM_RETRY_DELAY:PT5M}

spring.config.import=optional:file:.env.database.local[.properties],optional:file:../.env.database.local[.properties]

spring.datasource.url=${PATIENT_DB_URL}
spring.datasource.username=${PATIENT_DB_USERNAME}
spring.datasource.password=${PATIENT_DB_PASSWORD}
spring.datasource.hikari.pool-name=SahhaPatientPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
